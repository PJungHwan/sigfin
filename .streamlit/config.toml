[theme]
base = "light"
primaryColor = "#1D4ED8"
backgroundColor = "#F5F7FB"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0F172A"
borderColor = "#E2E8F0"
baseRadius = "12px"
buttonRadius = "8px"
showWidgetBorder = true
showSidebarBorder = true
dataframeHeaderBackgroundColor = "#EFF6FF"
headingFontSizes = ["28px", "24px", "20px", "18px", "16px", "14px"]

[theme.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#EFF6FF"

[browser]
gatherUsageStats = false
